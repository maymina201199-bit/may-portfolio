<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>May Mina | ניהול</title>
  <link rel="stylesheet" href="styles.css?v=20261129e">
</head>
<body class="home-page covers-page">
  <!--
    עמוד ניהול נסתר (לא בתפריט): בוחרים עמוד, והוא נפתח במצב עריכה (?edit),
    כלומר העמוד עצמו בדיוק כמו באתר, עם כלים לעריכה (admin-edit.js).
    כאן גם שומרים את "המפתח" של GitHub, שנשמר רק בדפדפן הזה ובלעדיו אי אפשר לשמור.
  -->
  <main class="covers admin">
    <h1 class="covers__title">ניהול האתר</h1>
    <p class="covers__intro"><a class="admin__back" href="index.html?v=20261129e">← חזרה לאתר</a></p>

    <!-- המפתח של GitHub -->
    <section class="covers__key">
      <label for="token">מפתח GitHub</label>
      <input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
      <button type="button" id="save-token">שמור מפתח</button>
      <button type="button" id="forget-token">מחק מפתח מהדפדפן</button>
      <p class="covers__status" id="token-status"></p>
    </section>

    <!-- בוחרים עמוד (השם הוא גם השם בכתובת), והוא נפתח במצב עריכה -->
    <p class="covers__intro">איזה עמוד עורכים? העמוד ייפתח בדיוק כמו באתר, עם כלים לעריכה.</p>
    <nav class="admin__page-list" id="page-list"></nav>

    <!-- ===== הגריד של עמוד הבית: הקאבר של כל פרויקט (תמונה או סרטון) ===== -->
    <section class="admin__home">
      <div class="admin__home-bar">
        <h2 class="admin__home-title">הגריד של עמוד הבית</h2>
        <span class="covers__status" id="home-status"></span>
        <button type="button" id="home-cancel">בטל שינויים</button>
        <button type="button" id="home-save">שמור</button>
      </div>
      <p class="covers__intro">לכל פרויקט: "תמונה" או "סרטון" מחליפים את הקאבר בקובץ מהמחשב (סרטון פשוט מתנגן בעמוד הבית). כלום לא משתנה באתר עד שלוחצים "שמור".</p>
      <div class="home-gallery admin__home-grid" id="home-grid" dir="ltr"></div>
    </section>

    <!-- פרויקט חדש: הטופס נפתח מה-"+" בסוף הגריד של עמוד הבית -->
    <div class="edit-modal" id="new-modal" hidden>
      <form class="edit-modal__box admin__new" id="new-form">
        <h2>פרויקט חדש</h2>
        <label>שם הפרויקט (מתחת לתמונה בעמוד הבית ובראש העמוד)
          <input name="title" required autocomplete="off" dir="ltr"></label>
        <label>השם בכתובת (באנגלית, בלי רווחים: למשל my-project)
          <input name="slug" required autocomplete="off" dir="ltr" pattern="[a-z0-9-]+"></label>
        <label>התחום (השורה ליד השם, למשל GRAPHIC DESIGN)
          <input name="field" autocomplete="off" dir="ltr"></label>
        <fieldset>
          <legend>קטגוריות בתפריט</legend>
          <label><input type="checkbox" name="cat" value="graphic-design"> graphic design</label>
          <label><input type="checkbox" name="cat" value="digital"> digital</label>
          <label><input type="checkbox" name="cat" value="photography"> photography</label>
          <label><input type="checkbox" name="cat" value="visual-identity"> visual Identity</label>
          <label><input type="checkbox" name="cat" value="social-media"> social media</label>
        </fieldset>
        <div class="edit-modal__actions">
          <span>קאבר:</span>
          <button type="button" data-cover="image">תמונה</button>
          <button type="button" data-cover="video">סרטון</button>
          <span id="new-cover-name">עוד לא נבחר</span>
        </div>
        <div class="edit-modal__actions">
          <button type="submit" class="is-main">צור פרויקט</button>
          <button type="button" data-act="close">ביטול</button>
        </div>
        <p class="edit-modal__note" id="new-status"></p>
      </form>
    </div>
    <input type="file" id="file-input" hidden>
  </main>

  <script>
    // העמודים (השם = השם בכתובת). manyone הוא עמוד סושיאל (פיד), השאר עמודי פרויקט (גריד)
    const PAGES = ["manyone", "modern-warfare", "hevel", "eat-and-drink", "sabra", "sela", "portrait", "1984-2025", "lifta"];
    const pageList = document.getElementById("page-list");
    PAGES.forEach(function (name) {
      const link = document.createElement("a");
      link.textContent = name;
      // ?t= כדי שהדפדפן יביא את הגרסה הכי חדשה של העמוד
      link.href = `${name}.html?edit=1&t=${Date.now()}`;
      pageList.appendChild(link);
    });

    // ===== המפתח: נשמר רק בדפדפן הזה =====
    const tokenInput = document.getElementById("token");
    const tokenStatus = document.getElementById("token-status");
    function readToken() { try { return localStorage.getItem("gh-token") || ""; } catch (e) { return ""; } }
    function showTokenState() {
      tokenStatus.textContent = readToken() ? "יש מפתח שמור בדפדפן הזה ✓" : "אין עדיין מפתח. בלי מפתח אי אפשר לשמור.";
    }
    document.getElementById("save-token").addEventListener("click", function () {
      try { localStorage.setItem("gh-token", tokenInput.value.trim()); } catch (e) {}
      tokenInput.value = "";
      showTokenState();
    });
    document.getElementById("forget-token").addEventListener("click", function () {
      try { localStorage.removeItem("gh-token"); } catch (e) {}
      showTokenState();
    });
    showTokenState();

    // ===================== הגריד של עמוד הבית =====================
    // קוראים את index.html, מציגים את הפרויקטים כמו בעמוד הבית, ומחליפים קאבר (תמונה / סרטון + פריים).
    // בשמירה עולים הקבצים החדשים, ואז מוחלף רק הדימוי של הפרויקטים ששונו
    const REPO = "maymina201199-bit/may-portfolio";
    const BRANCH = "main";
    const MAX_VIDEO_MB = 40;
    async function github(path, options) {
      const response = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
        ...options,
        headers: { Authorization: `Bearer ${readToken()}`, Accept: "application/vnd.github+json" },
      });
      if (!response.ok) {
        if (response.status === 401) throw new Error("המפתח לא תקין או שפג תוקפו");
        if (response.status === 403 || response.status === 404) throw new Error("למפתח אין הרשאה לכתוב לאתר");
        throw new Error("GitHub החזיר שגיאה " + response.status);
      }
      return response.json();
    }
    const currentFile = path => github(`${path}?ref=${BRANCH}&t=${Date.now()}`, { method: "GET", cache: "no-store" });
    async function saveFile(path, base64, message) {
      let sha;
      try { sha = (await currentFile(path)).sha; } catch (e) { sha = undefined; }
      return github(path, { method: "PUT", body: JSON.stringify({ message, content: base64, branch: BRANCH, sha }) });
    }
    function bytesToBase64(bytes) {
      let binary = "";
      for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      return btoa(binary);
    }
    const blobToBase64 = async blob => bytesToBase64(new Uint8Array(await blob.arrayBuffer()));
    const textToBase64 = text => bytesToBase64(new TextEncoder().encode(text));
    const base64ToText = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, "")), c => c.charCodeAt(0)));
    const escapeAttr = v => String(v).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    const stamp = () => Date.now().toString(36);
    const canvasToJpeg = (canvas, quality) => new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", quality || 0.9));

    const fileInput = document.getElementById("file-input");
    function pickFile(accept) {
      return new Promise(function (resolve) {
        fileInput.accept = accept;
        fileInput.value = "";
        fileInput.onchange = () => resolve(fileInput.files[0]);
        fileInput.click();
      });
    }
    // תמונה או פריים: עד 2000 פיקסלים ברוחב
    function toJpeg(source, width, height) {
      const scale = Math.min(1, 2000 / width);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      canvas.getContext("2d").drawImage(source, 0, 0, canvas.width, canvas.height);
      return canvasToJpeg(canvas, 0.9);
    }

    const homeGrid = document.getElementById("home-grid");
    const homeStatus = document.getElementById("home-status");
    const MEDIA = /<div class="home-gallery__media">[\s\S]*?<\/div>/g;
    let homeItems = [];
    let orderChanged = false;

    // ----- החיתוך של תמונה בריבוע של עמוד הבית -----
    // dx, dy: כמה התמונה זזה מהאמצע (באחוזים מהריבוע), zoom: הגדלה, rot: סיבוב במעלות.
    // בשמירה החיתוך "נאפה" לתמונה חדשה בדיוק בצורה של הריבוע (1440 על 1770), מהמקור באיכות מלאה,
    // כך שבעמוד הבית התמונה חדה גם אחרי זום. המקור נשמר בצד (data-original) כדי שאפשר יהיה לשנות שוב
    const BOX_W = 480, BOX_H = 590, BAKE_W = 1440, BAKE_H = Math.round(1440 * 590 / 480);
    const MAX_ORIGINAL = 6000; // המקור נשמר עד 6000 פיקסלים בצד הארוך
    function readCrop(media) {
      const crop = { original: media.getAttribute("data-original") || media.getAttribute("src"), dx: 0, dy: 0, zoom: 1, rot: 0, ratio: 0 };
      const saved = (media.getAttribute("data-crop") || "").split(/\s+/).map(Number);
      if (saved.length === 4 && saved.every(n => !isNaN(n))) [crop.dx, crop.dy, crop.zoom, crop.rot] = saved;
      return crop;
    }
    // כמה צריך להגדיל כדי שהסיבוב לא ישאיר פינות ריקות בריבוע
    function coverScale(rot) {
      const a = Math.abs(rot) * Math.PI / 180;
      return Math.max((BOX_W * Math.cos(a) + BOX_H * Math.sin(a)) / BOX_W, (BOX_W * Math.sin(a) + BOX_H * Math.cos(a)) / BOX_H);
    }
    const scaleOf = item => Math.max(item.zoom, coverScale(item.rot));
    const round2 = v => Math.round(v * 100) / 100;
    // לא מזיזים את התמונה מעבר לקצה של הריבוע
    function clampCrop(item) {
      const r = item.ratio || BOX_W / BOX_H;
      const extra = scaleOf(item) / coverScale(item.rot); // ההגדלה מעבר למה שהסיבוב צריך
      const coverW = Math.max(BOX_W, BOX_H * r) * extra, coverH = Math.max(BOX_H, BOX_W / r) * extra;
      const lx = (coverW - BOX_W) / 2 / BOX_W * 100, ly = (coverH - BOX_H) / 2 / BOX_H * 100;
      item.dx = Math.max(-lx, Math.min(lx, item.dx));
      item.dy = Math.max(-ly, Math.min(ly, item.dy));
    }
    // התצוגה בעמוד הניהול (אותה חשבון כמו האפייה)
    function cropStyle(item) {
      return `--r: ${item.ratio || BOX_W / BOX_H}; --dx: ${round2(item.dx)}%; --dy: ${round2(item.dy)}%; --rot: ${round2(item.rot)}deg; --s: ${round2(scaleOf(item))}`;
    }
    const cropChanged = item => !!(round2(item.dx) || round2(item.dy) || round2(item.zoom) !== 1 || round2(item.rot));
    // האפייה: מציירים את החיתוך על קנבס בגודל של הריבוע (פי 3), מהמקור
    async function bakeCrop(item) {
      const img = new Image();
      img.src = item.originalBlob ? URL.createObjectURL(item.originalBlob) : item.original;
      await img.decode();
      const r = img.naturalWidth / img.naturalHeight;
      const canvas = document.createElement("canvas");
      canvas.width = BAKE_W;
      canvas.height = BAKE_H;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingQuality = "high";
      const coverW = Math.max(BAKE_W, BAKE_H * r), coverH = Math.max(BAKE_H, BAKE_W / r);
      ctx.translate(BAKE_W / 2 + item.dx / 100 * BAKE_W, BAKE_H / 2 + item.dy / 100 * BAKE_H);
      ctx.rotate(item.rot * Math.PI / 180);
      ctx.scale(scaleOf(item), scaleOf(item));
      ctx.drawImage(img, -coverW / 2, -coverH / 2, coverW, coverH);
      return canvasToJpeg(canvas, 0.92);
    }

    async function loadHome() {
      homeStatus.textContent = "טוען…";
      let html;
      try {
        html = readToken() ? base64ToText((await currentFile("index.html")).content)
                           : await (await fetch("index.html?t=" + Date.now(), { cache: "no-store" })).text();
      } catch (error) { homeStatus.textContent = "לא נטען: " + error.message; return; }
      const doc = new DOMParser().parseFromString(html, "text/html");
      orderChanged = false;
      homeItems = [...doc.querySelectorAll(".home-gallery > .home-gallery__item")].map(function (item, orig) {
        const media = item.querySelector(".home-gallery__slide");
        return {
          orig, // המקום המקורי בעמוד (כדי לסדר מחדש בשמירה)
          page: ((item.getAttribute("href") || "").match(/^([\w-]+)\.html/) || [])[1] || "",
          name: (item.querySelector(".home-gallery__name") || {}).textContent || "",
          isVideo: media.tagName === "VIDEO",
          src: media.getAttribute("src"),
          poster: media.getAttribute("poster") || "",
          alt: media.getAttribute("alt") || media.getAttribute("aria-label") || "",
          changed: false,
          ...readCrop(media),
        };
      });
      homeStatus.textContent = "";
      // רשימת העמודים לעריכה: כל הפרויקטים שיש להם עמוד, לפי הסדר בעמוד הבית
      const pages = homeItems.map(item => item.page).filter(Boolean);
      if (pages.length) {
        pageList.innerHTML = "";
        pages.forEach(function (name) {
          const link = document.createElement("a");
          link.textContent = name;
          link.href = `${name}.html?edit=1&t=${Date.now()}`;
          pageList.appendChild(link);
        });
      }
      renderHome();
    }

    function renderHome() {
      homeGrid.innerHTML = "";
      homeItems.forEach(function (item, index) {
        const card = document.createElement("div");
        card.className = "home-gallery__item admin__home-item" + (item.changed ? " is-changed" : "");
        const preview = item.posterBlob ? (item.posterUrl ||= URL.createObjectURL(item.posterBlob))
                      : item.originalBlob ? (item.originalUrl ||= URL.createObjectURL(item.originalBlob))
                      : item.isVideo ? item.poster : item.original;
        card.innerHTML = `
          <div class="home-gallery__media"><img class="home-gallery__slide is-active" alt=""></div>
          <p class="home-gallery__name"></p>
          <div class="admin__home-tools">
            <button type="button" data-act="earlier" title="מקום אחד קודם">‹</button>
            <button type="button" data-act="image">תמונה</button>
            <button type="button" data-act="video">סרטון</button>
            <button type="button" data-act="later" title="מקום אחד הבא">›</button>
          </div>
          <button type="button" class="edit-handle" title="גררי כדי להזיז למקום אחר">⠿</button>
          <span class="edit-badge edit-badge--top">${item.isVideo ? "סרטון" : "תמונה"}${item.changed ? " · שונה" : ""}</span>`;
        const img = card.querySelector("img");
        img.src = preview;
        img.draggable = false;
        if (!item.isVideo) {
          img.classList.add("admin-crop");
          img.style.cssText = cropStyle(item);
          img.addEventListener("load", function () {
            const r = img.naturalWidth / img.naturalHeight;
            if (r && Math.abs(r - item.ratio) > 0.001) { item.ratio = r; clampCrop(item); img.style.cssText = cropStyle(item); }
          });
        }
        card.querySelector(".home-gallery__name").textContent = item.name;
        if (!item.isVideo) {
          card.classList.toggle("is-selected", index === selectedHome);
          if (index === selectedHome) card.insertAdjacentHTML("beforeend", '<span class="edit-badge admin__home-hint">גררי את התמונה כדי לבחור מה רואים</span>');
          card.querySelector(".home-gallery__media").addEventListener("pointerdown", e => startPan(e, index, card, img));
        }
        card.addEventListener("click", function (e) {
          const b = e.target.closest("button");
          if (!b) return;
          if (b.dataset.act === "image") chooseImage(index);
          if (b.dataset.act === "video") chooseVideo(index);
          if (b.dataset.act === "earlier") moveHome(index, index - 1);
          if (b.dataset.act === "later") moveHome(index, index + 2);
        });
        // גרירה למקום אחר בעזרת הידית ⠿ (גרירה על התמונה עצמה היא חיתוך)
        card.querySelector(".edit-handle").addEventListener("pointerdown", () => { card.draggable = true; });
        card.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", index); card.classList.add("is-dragging"); });
        card.addEventListener("dragend", () => { card.draggable = false; card.classList.remove("is-dragging"); });
        card.addEventListener("dragover", e => e.preventDefault());
        card.addEventListener("drop", function (e) {
          e.preventDefault();
          const box = card.getBoundingClientRect();
          moveHome(Number(e.dataTransfer.getData("text/plain")), index + (e.clientX > box.left + box.width / 2 ? 1 : 0));
        });
        homeGrid.appendChild(card);
      });
      const plus = document.createElement("button");
      plus.type = "button";
      plus.className = "admin__home-new";
      plus.innerHTML = '<span>+</span>פרויקט חדש';
      plus.addEventListener("click", openNewProject);
      homeGrid.appendChild(plus);
    }

    // ----- בחירת תמונה, גרירה, זום וסיבוב -----
    let selectedHome = -1;
    const homeTools = document.createElement("div");
    homeTools.className = "edit-tools";
    homeTools.hidden = true;
    document.body.appendChild(homeTools);
    function startPan(e, index, card, img) {
      if (e.target.closest("button")) return;
      if (index !== selectedHome) { selectedHome = index; renderHome(); showHomeTools(); return; }
      const item = homeItems[index];
      const media = card.querySelector(".home-gallery__media");
      const box = media.getBoundingClientRect();
      const start = { x: e.clientX, y: e.clientY, dx: item.dx, dy: item.dy };
      media.setPointerCapture(e.pointerId);
      function move(ev) {
        item.dx = start.dx + (ev.clientX - start.x) / box.width * 100;
        item.dy = start.dy + (ev.clientY - start.y) / box.height * 100;
        clampCrop(item);
        img.style.cssText = cropStyle(item);
      }
      function up() {
        media.removeEventListener("pointermove", move);
        media.removeEventListener("pointerup", up);
        if (item.dx !== start.dx || item.dy !== start.dy) { item.changed = true; card.classList.add("is-changed"); }
      }
      media.addEventListener("pointermove", move);
      media.addEventListener("pointerup", up);
    }
    function showHomeTools() {
      const item = homeItems[selectedHome];
      homeTools.hidden = !item || item.isVideo;
      homeTools.innerHTML = "";
      if (homeTools.hidden) return;
      homeTools.innerHTML = `
        <div class="edit-tools__group"><span>${item.name}</span></div>
        <div class="edit-tools__group"><span>זום:</span><input type="range" dir="ltr" min="1" max="3" step="0.01" data-key="zoom"><span data-show="zoom"></span></div>
        <div class="edit-tools__group"><span>סיבוב:</span><input type="range" dir="ltr" min="-180" max="180" step="0.5" data-key="rot"><span data-show="rot"></span>
          <button type="button" data-turn="-90">↺ 90°</button><button type="button" data-turn="90">↻ 90°</button></div>
        <div class="edit-tools__group"><button type="button" data-act="reset">איפוס</button><button type="button" data-act="close">✕</button></div>`;
      const show = () => {
        homeTools.querySelector('[data-show="zoom"]').textContent = Math.round(item.zoom * 100) + "%";
        homeTools.querySelector('[data-show="rot"]').textContent = round2(item.rot) + "°";
      };
      homeTools.querySelectorAll("input[data-key]").forEach(function (input) {
        input.value = item[input.dataset.key];
        input.addEventListener("input", function () {
          item[input.dataset.key] = Number(input.value);
          clampCrop(item);
          item.changed = true;
          const img = homeGrid.children[selectedHome].querySelector("img");
          img.style.cssText = cropStyle(item);
          homeGrid.children[selectedHome].classList.add("is-changed");
          show();
        });
      });
      show();
    }
    homeTools.addEventListener("click", function (e) {
      const b = e.target.closest("button");
      const item = homeItems[selectedHome];
      if (!b || !item) return;
      if (b.dataset.turn) item.rot = ((item.rot + Number(b.dataset.turn) + 540) % 360) - 180;
      if (b.dataset.act === "reset") Object.assign(item, { dx: 0, dy: 0, zoom: 1, rot: 0 });
      if (b.dataset.act === "close") { selectedHome = -1; renderHome(); showHomeTools(); return; }
      clampCrop(item);
      item.changed = true;
      renderHome();
      showHomeTools();
    });

    // הסדר החדש בקוד של עמוד הבית: כל פרויקט (עם ההערה שמעליו, אם יש) עובר כיחידה אחת
    function reorderHome(html) {
      const start = html.indexOf('<div class="home-gallery">');
      const end = html.lastIndexOf("\n    </div>\n  </main>");
      if (start < 0 || end < 0) throw new Error("לא מצאתי את הגריד בעמוד הבית");
      const open = start + '<div class="home-gallery">'.length;
      const inner = html.slice(open, end);
      const starts = [];
      const itemStart = /\n(?:[ \t]*<!--[^\n]*-->\n)?[ \t]*<(?:a|div) class="home-gallery__item"/g;
      let m;
      while ((m = itemStart.exec(inner))) starts.push(m.index);
      if (starts.length !== homeItems.length) throw new Error("מספר הפרויקטים בעמוד הבית לא תואם. רעננו את העמוד ונסו שוב");
      const head = inner.slice(0, starts[0]);
      const chunks = starts.map((at, i) => inner.slice(at, i + 1 < starts.length ? starts[i + 1] : inner.length).replace(/\s+$/, ""));
      const ordered = homeItems.map(item => chunks[item.orig]).join("\n");
      return html.slice(0, open) + head + ordered + html.slice(end);
    }

    // שינוי הסדר בגריד של עמוד הבית
    function moveHome(from, to) {
      if (from < 0 || from >= homeItems.length) return;
      const selectedItem = homeItems[selectedHome]; // התמונה שנבחרה נשארת בחורה גם אחרי ההזזה
      const [item] = homeItems.splice(from, 1);
      if (to > from) to--;
      to = Math.max(0, Math.min(homeItems.length, to));
      homeItems.splice(to, 0, item);
      selectedHome = selectedItem ? homeItems.indexOf(selectedItem) : -1;
      orderChanged = homeItems.some((it, i) => it.orig !== i);
      homeStatus.textContent = orderChanged ? "הסדר השתנה (עוד לא נשמר)" : "";
      renderHome();
    }

    async function chooseImage(index) {
      const file = await pickFile("image/*");
      if (!file) return;
      const img = new Image();
      img.src = URL.createObjectURL(file);
      try { await img.decode(); } catch (e) { homeStatus.textContent = "הדפדפן לא מצליח לפתוח את התמונה (אם זה HEIC, שמרי אותה קודם כ-JPG)"; return; }
      const item = homeItems[index];
      // המקור באיכות מלאה (עד 6000 פיקסלים), ממנו נחתך הקאבר בשמירה
      const scale = Math.min(1, MAX_ORIGINAL / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      Object.assign(item, { isVideo: false, originalBlob: await canvasToJpeg(canvas, 0.92), originalUrl: null, ratio: canvas.width / canvas.height,
        videoFile: null, posterBlob: null, posterUrl: null, changed: true, dx: 0, dy: 0, zoom: 1, rot: 0 });
      selectedHome = index;
      renderHome();
      showHomeTools();
    }
    // סרטון: מתנגן בעמוד הבית. הפריים הראשון נשמר לבד כתמונה שרואים עד שהסרטון נטען
    async function chooseVideo(index) {
      const file = await pickFile("video/*");
      if (!file) return;
      if (file.size > MAX_VIDEO_MB * 1024 * 1024) { homeStatus.textContent = `הסרטון גדול מ-${MAX_VIDEO_MB}MB. שלחי לי אותו ואכווץ אותו.`; return; }
      const video = document.createElement("video");
      video.muted = true;
      video.src = URL.createObjectURL(file);
      try {
        await new Promise((resolve, reject) => { video.onloadeddata = resolve; video.onerror = reject; });
        video.currentTime = 0.05;
        await new Promise(resolve => { video.onseeked = resolve; });
      } catch (e) { homeStatus.textContent = "הדפדפן לא מצליח לפתוח את הסרטון. נסי לשמור אותו כ-MP4."; return; }
      const item = homeItems[index];
      Object.assign(item, { isVideo: true, videoFile: file, originalBlob: null, posterBlob: await toJpeg(video, video.videoWidth, video.videoHeight), posterUrl: null, changed: true });
      renderHome();
    }

    // ----- שמירה -----
    document.getElementById("home-cancel").addEventListener("click", function () { selectedHome = -1; showHomeTools(); loadHome(); });
    document.getElementById("home-save").addEventListener("click", async function () {
      if (!readToken()) { homeStatus.textContent = "צריך קודם לשמור מפתח GitHub (למעלה)."; return; }
      const button = this;
      button.disabled = true;
      try {
        for (const item of homeItems.filter(it => it.changed)) {
          const id = stamp();
          if (!item.isVideo) {
            if (item.originalBlob) {
              homeStatus.textContent = `מעלה את התמונה המקורית (${item.name})…`;
              const originalPath = `images/home-${id}-original.jpg`;
              await saveFile(originalPath, await blobToBase64(item.originalBlob), `Home: original image for ${item.name} (from the admin page)`);
              item.original = originalPath;
            }
            homeStatus.textContent = `חותך ומעלה את הקאבר (${item.name})…`;
            const baked = await bakeCrop(item);
            item.originalBlob = null;
            item.src = `images/home-${id}.jpg`;
            await saveFile(item.src, await blobToBase64(baked), `Home: new cover for ${item.name} (from the admin page)`);
          }
          if (item.videoFile) {
            homeStatus.textContent = `מעלה סרטון (${item.name})… זה יכול לקחת קצת זמן`;
            const ext = (item.videoFile.name.split(".").pop() || "mp4").toLowerCase();
            item.src = `images/home-${id}.${ext}`;
            await saveFile(item.src, await blobToBase64(item.videoFile), `Home: new video for ${item.name} (from the admin page)`);
          }
          if (item.posterBlob) {
            homeStatus.textContent = `מעלה קאבר (${item.name})…`;
            item.poster = `images/home-${id}-poster.jpg`;
            await saveFile(item.poster, await blobToBase64(item.posterBlob), `Home: new video cover for ${item.name} (from the admin page)`);
          }
        }
        homeStatus.textContent = "שומר את עמוד הבית…";
        const page = await currentFile("index.html");
        let n = -1;
        const byOrig = [];
        homeItems.forEach(item => { byOrig[item.orig] = item; });
        let html = base64ToText(page.content).replace(MEDIA, function (block) {
          const item = byOrig[++n];
          if (!item || !item.changed) return block;
          const media = item.isVideo
            ? `<video class="home-gallery__slide is-active" src="${escapeAttr(item.src)}" poster="${escapeAttr(item.poster)}" autoplay muted loop playsinline aria-label="${escapeAttr(item.alt)}"></video>`
            : `<img class="home-gallery__slide is-active" src="${escapeAttr(item.src)}" alt="${escapeAttr(item.alt)}" data-original="${escapeAttr(item.original)}" data-crop="${round2(item.dx)} ${round2(item.dy)} ${round2(item.zoom)} ${round2(item.rot)}">`;
          return `<div class="home-gallery__media">\n          ${media}\n        </div>`;
        });
        if (orderChanged) html = reorderHome(html);
        await github("index.html", { method: "PUT", body: JSON.stringify({ message: orderChanged ? "Home: new order and covers (from the admin page)" : "Home: new covers (from the admin page)", content: textToBase64(html), branch: BRANCH, sha: page.sha }) });
        if (orderChanged) {
          // "Next project" עובר בין הפרויקטים לפי הסדר בעמוד הבית
          homeStatus.textContent = "מעדכן את הסדר של Next project…";
          const script = await currentFile("project.js");
          const code = base64ToText(script.content);
          const order = homeItems.map(item => item.page).filter(Boolean);
          const updatedCode = code.replace(/const PROJECT_ORDER = \[[^\]]*\];/, `const PROJECT_ORDER = [${order.map(p => `"${p}"`).join(", ")}];`);
          if (updatedCode !== code) await github("project.js", { method: "PUT", body: JSON.stringify({ message: "Next project order follows the home grid (from the admin page)", content: textToBase64(updatedCode), branch: BRANCH, sha: script.sha }) });
          homeItems.forEach((item, i) => { item.orig = i; });
          orderChanged = false;
        }
        homeItems.forEach(item => { item.changed = false; item.originalBlob = null; item.videoFile = null; item.posterBlob = null; });
        renderHome();
        homeStatus.textContent = "נשמר ✓ האתר יתעדכן תוך דקה-שתיים";
      } catch (error) {
        homeStatus.textContent = "לא נשמר: " + error.message;
      }
      button.disabled = false;
    });
    // ===================== פרויקט חדש =====================
    // יוצר עמוד פרויקט חדש (לפי התבנית של עמוד קיים), מוסיף אותו לסוף הגריד של עמוד הבית
    // ולסדר של "Next project". אחר כך עורכים אותו כרגיל (תמונות, טקסט) מהרשימה למעלה
    const newModal = document.getElementById("new-modal");
    const newForm = document.getElementById("new-form");
    const newStatus = document.getElementById("new-status");
    let newCover = null; // { kind: "image" | "video", file, blob, poster }
    const toSlug = text => text.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    function openNewProject() {
      if (!readToken()) { homeStatus.textContent = "צריך קודם לשמור מפתח GitHub (למעלה)."; return; }
      newForm.reset();
      newCover = null;
      document.getElementById("new-cover-name").textContent = "עוד לא נבחר";
      newStatus.textContent = "";
      newModal.hidden = false;
      newForm.title.focus();
    }
    newForm.title.addEventListener("input", () => { if (!newForm.slug.dataset.touched) newForm.slug.value = toSlug(newForm.title.value); });
    newForm.slug.addEventListener("input", () => { newForm.slug.dataset.touched = "1"; });
    newModal.addEventListener("click", async function (e) {
      const b = e.target.closest("button");
      if (e.target === newModal || (b && b.dataset.act === "close")) { newModal.hidden = true; return; }
      if (!b || !b.dataset.cover) return;
      const file = await pickFile(b.dataset.cover === "image" ? "image/*" : "video/*");
      if (!file) return;
      try {
        if (b.dataset.cover === "image") {
          const img = new Image();
          img.src = URL.createObjectURL(file);
          await img.decode();
          newCover = { kind: "image", blob: await toJpeg(img, img.naturalWidth, img.naturalHeight) };
        } else {
          if (file.size > MAX_VIDEO_MB * 1024 * 1024) throw new Error(`הסרטון גדול מ-${MAX_VIDEO_MB}MB. שלחי לי אותו ואכווץ אותו.`);
          const video = document.createElement("video");
          video.muted = true;
          video.src = URL.createObjectURL(file);
          await new Promise((resolve, reject) => { video.onloadeddata = resolve; video.onerror = () => reject(new Error("הדפדפן לא מצליח לפתוח את הסרטון. נסי לשמור אותו כ-MP4.")); });
          video.currentTime = 0.05;
          await new Promise(resolve => { video.onseeked = resolve; });
          newCover = { kind: "video", file, poster: await toJpeg(video, video.videoWidth, video.videoHeight) };
        }
        document.getElementById("new-cover-name").textContent = file.name + " ✓";
      } catch (error) { newStatus.textContent = error.message || "הדפדפן לא מצליח לפתוח את הקובץ (אם זו תמונת HEIC, שמרי אותה קודם כ-JPG)"; }
    });

    newForm.addEventListener("submit", async function (e) {
      e.preventDefault();
      const title = newForm.title.value.trim();
      const slug = toSlug(newForm.slug.value);
      const field = newForm.field.value.trim();
      const cats = [...newForm.querySelectorAll('input[name="cat"]:checked')].map(c => c.value);
      if (!slug) { newStatus.textContent = "צריך שם בכתובת (אותיות באנגלית, מספרים ומקפים)."; return; }
      if (!newCover) { newStatus.textContent = "צריך לבחור קאבר (תמונה או סרטון)."; return; }
      if (!cats.length) { newStatus.textContent = "צריך לבחור לפחות קטגוריה אחת."; return; }
      const button = newForm.querySelector('[type="submit"]');
      button.disabled = true;
      try {
        // העמוד לא קיים כבר?
        let exists = true;
        try { await currentFile(slug + ".html"); } catch (err) { exists = false; }
        if (exists) throw new Error(`כבר יש עמוד בשם ${slug}. בחרי שם אחר בכתובת.`);
        const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const folder = `images/projects/${slug}`;

        // 1. הקאבר
        newStatus.textContent = "מעלה את הקאבר…";
        let coverImage, homeMedia, introMedia;
        if (newCover.kind === "image") {
          coverImage = `${folder}/00-cover.jpg`;
          await saveFile(coverImage, await blobToBase64(newCover.blob), `${slug}: cover (new project from the admin page)`);
          homeMedia = `<img class="home-gallery__slide is-active" src="${coverImage}" alt="${escapeAttr(title)}">`;
          introMedia = `<img class="project-intro__image" src="${coverImage}" alt="${escapeAttr(title)}">`;
        } else {
          const ext = (newCover.file.name.split(".").pop() || "mp4").toLowerCase();
          const videoPath = `${folder}/00-cover.${ext}`;
          coverImage = `${folder}/00-cover-poster.jpg`;
          newStatus.textContent = "מעלה את הסרטון… זה יכול לקחת קצת זמן";
          await saveFile(videoPath, await blobToBase64(newCover.file), `${slug}: cover video (new project from the admin page)`);
          await saveFile(coverImage, await blobToBase64(newCover.poster), `${slug}: cover poster`);
          homeMedia = `<video class="home-gallery__slide is-active" src="${videoPath}" poster="${coverImage}" autoplay muted loop playsinline aria-label="${escapeAttr(title)}"></video>`;
          introMedia = `<video class="project-intro__image" src="${videoPath}" poster="${coverImage}" autoplay muted loop playsinline aria-label="${escapeAttr(title)}"></video>`;
        }

        // 2. העמוד: לפי התבנית של עמוד sela (כותרת, תפריט, פרטי קשר וסקריפטים), עם התוכן של הפרויקט החדש
        newStatus.textContent = "יוצר את העמוד…";
        let page = base64ToText((await currentFile("sela.html")).content);
        page = page
          .replace(/<title>[^<]*<\/title>/, `<title>May Mina | ${esc(title)}</title>`)
          .replace(/<!--\s*\n\s*עמוד פרויקט[\s\S]*?-->/, `<!--\n    עמוד פרויקט (נוצר מעמוד הניהול). את התמונות, הטקסטים והגריד עורכים בעמוד הניהול (covers.html).\n    הדימויים של הפרויקט נמצאים בתיקייה ${folder}.\n  -->`)
          .replace(/ class="home-menu__item--current"/g, "")
          .replace(new RegExp(`(<a)( href="index\\.html\\?v=[^"&]*&category=${cats[0]}")`), `$1 class="home-menu__item--current"$2`)
          .replace(/<p class="project-meta project-meta--title">[\s\S]*?<\/p>/, `<p class="project-meta project-meta--title">${esc(title)}</p>`)
          .replace(/<p class="project-meta project-meta--field">[\s\S]*?<\/p>/, `<p class="project-meta project-meta--field">${esc(field || "IMAGES")}</p>`)
          .replace(/<section class="project-intro">[\s\S]*?<\/section>/, `<section class="project-intro">\n      ${introMedia}\n      <p class="project-intro__description">\n        Write the project text here (in the admin page).\n      </p>\n    </section>`)
          .replace(/<section class="project-images[^"]*">[\s\S]*?<\/section>/, `<section class="project-images project-grid">\n    </section>`);
        await github(`${slug}.html`, { method: "PUT", body: JSON.stringify({ message: `${slug}: new project page (from the admin page)`, content: textToBase64(page), branch: BRANCH }) });

        // 3. עמוד הבית: הפרויקט נוסף בסוף הגריד
        newStatus.textContent = "מוסיף לעמוד הבית…";
        const home = await currentFile("index.html");
        const homeHtml = base64ToText(home.content);
        const version = (homeHtml.match(/styles\.css\?v=([^"]+)"/) || [])[1] || "";
        const item = `\n      <a class="home-gallery__item" href="${slug}.html${version ? "?v=" + version : ""}" data-categories="${cats.join(" ")}" data-preview="${coverImage}">\n        <div class="home-gallery__media">\n          ${homeMedia}\n        </div>\n        <p class="home-gallery__name">${esc(title)}</p>\n      </a>`;
        const end = homeHtml.lastIndexOf("\n    </div>\n  </main>");
        if (end < 0) throw new Error("לא מצאתי את הסוף של הגריד בעמוד הבית");
        await github("index.html", { method: "PUT", body: JSON.stringify({ message: `Home: add ${slug} (new project from the admin page)`, content: textToBase64(homeHtml.slice(0, end) + "\n" + item + homeHtml.slice(end)), branch: BRANCH, sha: home.sha }) });

        // 4. הסדר של "Next project"
        const script = await currentFile("project.js");
        const code = base64ToText(script.content);
        const updatedCode = code.replace(/const PROJECT_ORDER = \[([^\]]*)\];/, (all, list) => `const PROJECT_ORDER = [${list}, "${slug}"];`);
        if (updatedCode !== code) await github("project.js", { method: "PUT", body: JSON.stringify({ message: `Next project order: add ${slug}`, content: textToBase64(updatedCode), branch: BRANCH, sha: script.sha }) });

        newStatus.textContent = "נוצר ✓";
        newModal.hidden = true;
        homeStatus.textContent = `הפרויקט ${slug} נוצר ✓ הוא יופיע באתר תוך דקה-שתיים. אפשר לערוך אותו מהרשימה למעלה.`;
        loadHome();
      } catch (error) {
        newStatus.textContent = "לא נוצר: " + error.message;
      }
      button.disabled = false;
    });

    loadHome();
  </script>
</body>
</html>

  <!--
    הפרויקטים מסודרים בשורות של שלושה (<section class="home-row">). כל שורה כוללת

    כדי להוסיף שורה: מעתיקים <section class="home-row"> שלם ומחליפים דימויים ושמות.

    בכל ריבוע יכולים להיות כמה דימויים (class="home-gallery__slide").
    הראשון מסומן is-active ומופיע קודם. לחיצה בחצי הימני: הבא, בחצי השמאלי: הקודם.
    בדימוי האחרון מופיע "explore the project", ולחיצה מובילה לכתובת שב-data-project-url
    (כרגע ריק, עד שיהיו עמודי פרויקטים).

  <!-- התווית שעוקבת אחרי העכבר מעל הדימויים -->
  <div class="cursor-label" aria-hidden="true">
    <!-- [ NEXT ] / [ PREV ] -->
    <span class="cursor-label__bracket">[</span><span class="cursor-label__text">next</span><span class="cursor-label__bracket">]</span>

    <!-- הסמן הצהוב עם החץ: מופיע בדימוי האחרון, במקום NEXT -->
    <span class="cursor-label__arrow">
      <img src="images/arrow-right.png" alt="">
      <span class="cursor-label__arrow-cover"></span>
    </span>
  </div>

  <script>
    // ===== מסך הפתיחה =====
    const intro = document.querySelector(".intro");
    if (intro) {
      const introLetter = intro.querySelector(".intro__letter");
      const LETTERS = ["m", "a", "y", "m", "i", "n", "a"];
      const LETTER_SPEED = 100; // כל אות מופיעה 0.1 שנייה, כמו באתר של Bibliothèque
      const MIN_ROUNDS = 2;     // כמה פעמים לפחות עוברים על כל האותיות
      const FADE_DURATION = 500; // כמה זמן המסך נעלם בהדרגה

      let letterIndex = 0;
      let rounds = 0;
      let pageLoaded = false;
      window.addEventListener("load", () => { pageLoaded = true; });

      function nextLetter() {
        letterIndex = (letterIndex + 1) % LETTERS.length;
        if (letterIndex === 0) rounds++;
        introLetter.textContent = LETTERS[letterIndex];

        // עוצרים על האות האחרונה, אחרי מספיק סיבובים וכשהעמוד סיים להיטען
        const onLastLetter = letterIndex === LETTERS.length - 1;
        if (onLastLetter && rounds >= MIN_ROUNDS - 1 && pageLoaded) {
          setTimeout(hideIntro, LETTER_SPEED * 3);
        } else {
          setTimeout(nextLetter, LETTER_SPEED);
        }
      }

      function hideIntro() {
        intro.classList.add("is-hidden");
        setTimeout(() => intro.remove(), FADE_DURATION);
      }

      // מי שביקש במחשב פחות אנימציות: בלי אותיות מתחלפות
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        hideIntro();
      } else {
        // מתחילים אחרי שהפונט נטען, כדי שהאותיות לא יופיעו קודם בפונט אחר
        document.fonts.ready.then(() => setTimeout(nextLetter, LETTER_SPEED));
      }
    }

    // ===== סרטונים בלולאה =====
    // לכל הסרטונים יש loop, וזו רשת ביטחון: אם סרטון בכל זאת נעצר בסוף, מתחילים אותו מחדש
    document.querySelectorAll("video[loop]").forEach(function (video) {
      video.addEventListener("ended", function () {
        video.currentTime = 0;
        video.play();
      });
    });

    // ===== התווית [ NEXT ] / [ PREV ] שעוקבת אחרי העכבר =====
    const label = document.querySelector(".cursor-label");
    const labelText = document.querySelector(".cursor-label__text");

    // התווית יושבת קצת מימין לעכבר
    const LABEL_OFFSET_X = 18;
    const LABEL_OFFSET_Y = -6;
    // כמה מהר התווית משיגה את העכבר (מספר קטן = נגררת יותר לאט)
    const LABEL_FOLLOW = 0.18;

    let mouseX = 0, mouseY = 0; // איפה העכבר
    let labelX = 0, labelY = 0; // איפה התווית

    // בכל פריים התווית זזה קצת לכיוון העכבר, וכך היא נגררת אחריו ברכות
    function moveLabel() {
      labelX += (mouseX - labelX) * LABEL_FOLLOW;
      labelY += (mouseY - labelY) * LABEL_FOLLOW;
      label.style.transform = `translate(${labelX + LABEL_OFFSET_X}px, ${labelY + LABEL_OFFSET_Y}px)`;
      requestAnimationFrame(moveLabel);
    }
    requestAnimationFrame(moveLabel);

    // באיזה חצי של הריבוע העכבר נמצא: ימני = הבא, שמאלי = הקודם
    function isRightHalf(item, x) {
      const box = item.getBoundingClientRect();
      return x > box.left + box.width / 2;
    }

    // האם רואים עכשיו את הדימוי האחרון בריבוע
    function isLastSlide(item) {
      const total = item.querySelectorAll(".home-gallery__slide").length;
      return Number(item.dataset.current || 0) === total - 1;
    }

    // מה התווית אומרת: בדימוי האחרון, בחצי הימני, היא מזמינה לעמוד הפרויקט
    function updateLabel(item, x) {
      const explore = isRightHalf(item, x) && isLastSlide(item);
      label.classList.toggle("is-explore", explore);
      labelText.textContent = explore ? "explore the project" : (isRightHalf(item, x) ? "next" : "prev");
    }

    // ===== המספור 01 | 02 | 03 =====
    // נבנה לבד לפי מספר הדימויים בריבוע, והמספר של הדימוי הנוכחי מסומן בקו תחתון
    function updateCounter(item, currentIndex) {
      const counter = item.querySelector(".home-gallery__counter");
      const total = item.querySelectorAll(".home-gallery__slide").length;
      const numbers = [];
      for (let i = 0; i < total; i++) {
        const number = String(i + 1).padStart(2, "0");
        numbers.push(i === currentIndex ? `<span class="is-current">${number}</span>` : number);
      }
      counter.innerHTML = numbers.join(" | ");
    }

    // ===== מעבר בין דימויים בתוך ריבוע =====
    const SLIDE_DURATION = 900;
    const SLIDE_EASING = "cubic-bezier(0.76, 0, 0.24, 1)";
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function showSlide(item, direction) {
      const slides = [...item.querySelectorAll(".home-gallery__slide")];
      if (slides.length < 2 || item.dataset.moving) return; // אין לאן לעבור, או שעוד באמצע מעבר

      const current = slides.findIndex(slide => slide.classList.contains("is-active"));
      const next = (current + direction + slides.length) % slides.length;
      const oldSlide = slides[current];
      const newSlide = slides[next];

      newSlide.classList.add("is-active");
      if (newSlide.tagName === "VIDEO") newSlide.play();
      updateCounter(item, next);
      item.dataset.current = next; // זוכרים איזה דימוי מוצג עכשיו

      function finish() {
        oldSlide.classList.remove("is-active");
        if (oldSlide.tagName === "VIDEO") oldSlide.pause();
        newSlide.style.zIndex = "";
        delete item.dataset.moving;
      }

      if (reduceMotion) return finish();
      item.dataset.moving = "true";

      // הדימוי החדש נחשף מלמעלה למטה (הבא) או מלמטה למעלה (הקודם),
      // והישן זז קצת באותו כיוון מתחתיו
      newSlide.style.zIndex = 1;
      const hiddenEdge = direction > 0 ? "inset(0 0 100% 0)" : "inset(100% 0 0 0)";
      const push = direction > 0 ? "10%" : "-10%";

      newSlide.animate(
        [{ clipPath: hiddenEdge }, { clipPath: "inset(0 0 0 0)" }],
        { duration: SLIDE_DURATION, easing: SLIDE_EASING }
      );
      oldSlide.animate(
        [{ transform: "translateY(0)" }, { transform: `translateY(${push})` }],
        { duration: SLIDE_DURATION, easing: SLIDE_EASING }
      ).onfinish = finish;
    }

    // ===== חזרה לדימוי הראשון =====
    function resetToFirstSlide(item) {
      const slides = [...item.querySelectorAll(".home-gallery__slide")];
      slides.forEach(function (slide, index) {
        slide.getAnimations().forEach(animation => animation.cancel()); // עוצרים מעבר שבאמצע
        slide.style.zIndex = "";
        slide.classList.toggle("is-active", index === 0);
        if (slide.tagName === "VIDEO") {
          if (index === 0) slide.play(); else slide.pause();
        }
      });
      delete item.dataset.moving;
      item.dataset.current = 0;
      updateCounter(item, 0);
    }

    // כמה זמן מחכים אחרי שהעכבר יצא, עד שהדימוי נעלם והמסגרת חזרה (קצת יותר מ--reveal-duration ב-styles.css)
    const HIDE_DURATION = 600;

    // ===== חיבור הכול לכל ריבוע בגלריה =====
    document.querySelectorAll(".home-gallery__item").forEach(function (item) {
      // מוסיפים לכל ריבוע את המספור שלו
      const counter = document.createElement("p");
      counter.className = "home-gallery__counter";
      item.appendChild(counter);
      updateCounter(item, 0);

      let resetTimer; // הטיימר של החזרה לדימוי הראשון

      item.addEventListener("mouseenter", function (event) {
        clearTimeout(resetTimer); // חזרנו לפני שהספיק להתאפס: נשארים באותו דימוי
        // התווית מתחילה מהמקום של העכבר, ולא עפה מהפינה
        mouseX = labelX = event.clientX;
        mouseY = labelY = event.clientY;
        label.classList.add("is-visible");
      });

      item.addEventListener("mousemove", function (event) {
        mouseX = event.clientX;
        mouseY = event.clientY;
        updateLabel(item, event.clientX);
      });

      item.addEventListener("mouseleave", function () {
        label.classList.remove("is-visible");

        // כשיוצאים מהדימוי הוא חוזר לדימוי הראשון,
        // אחרי שהדימוי נעלם, כדי שההחלפה לא תיראה
        resetTimer = setTimeout(function () {
          resetToFirstSlide(item);
        }, HIDE_DURATION);
      });

      item.addEventListener("click", function (event) {
        const goingForward = isRightHalf(item, event.clientX);

        // בדימוי האחרון, "הבא" מוביל לעמוד הפרויקט (הכתובת ב-data-project-url)
        if (goingForward && isLastSlide(item)) {
          if (item.dataset.projectUrl) window.location.href = item.dataset.projectUrl;
          return;
        }

        showSlide(item, goingForward ? 1 : -1);
        updateLabel(item, event.clientX);
      });
    });
  </script>

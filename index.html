<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>May Mina</title>
  <link rel="stylesheet" href="styles.css">
  <!-- טוענים את הפונט של השם מוקדם, כדי שמסך הפתיחה יופיע ישר בפונט הנכון -->
  <link rel="preload" href="fonts/PolymathDispDemo-Regular.otf" as="font" type="font/otf" crossorigin>
</head>
<body class="home-page">
  <!-- מסך הפתיחה: האותיות של "may mina" מתחלפות אחת אחרי השנייה באמצע המסך.
       מופיע בכל פעם שהעמוד נטען או מתרענן -->
  <div class="intro" aria-hidden="true">
    <span class="intro__letter">m</span>
  </div>

  <!-- החלק העליון: שם ותפריט (בעמוד הבית הוא נמוך יותר, home-header--compact) -->
  <header class="home-header home-header--compact">
    <h1 class="home-name">may mina .</h1>

    <!-- קישור לעמוד התהליך: עיגול קטן בפינה הימנית העליונה -->
    <a class="home-process-link" href="process.html" aria-label="process" title="process"></a>

    <!-- התפריט: לחיצה על קטגוריה מציגה רק את הפרויקטים שלה. "works" = כל העבודות (ברירת המחדל).
         data-filter הוא שם הקטגוריה, כמו ב-data-categories של כל פרויקט -->
    <nav class="home-menu">
      <button class="home-menu__label" type="button" data-filter="all">works</button>
      <ul class="home-menu__list">
        <li><button type="button" data-filter="graphic-design">graphic design</button></li>
        <li><button type="button" data-filter="digital">digital</button></li>
        <li><button type="button" data-filter="photography">photography</button></li>
        <li><button type="button" data-filter="visual-identity">visual Identity</button></li>
        <li><button type="button" data-filter="social-media">social media</button></li>
      </ul>
    </nav>
  </header>

  <!--
    הפרויקטים: כל פרויקט הוא בלוק אחד עם הדימוי והשם שלו, והרשת מסדרת אותם שלושה בשורה.
    data-categories: הקטגוריות של הפרויקט (מופרדות ברווח), לסינון לפי התפריט.
    data-preview: 4 הדימויים שעולים בחלון שנפתח בלחיצה (מופרדים בפסיקים).
    כדי להוסיף פרויקט: מעתיקים בלוק שלם ומחליפים קישור, דימויים, קטגוריות ושם.
    (ל-Manyone עוד אין עמוד, אז הוא לא קישור.)
  -->
  <main class="home-projects">
    <div class="home-gallery">
      <div class="home-gallery__item" data-categories="social-media">
        <div class="home-gallery__media">
          <video class="home-gallery__slide is-active" src="images/home-manyone.mp4" poster="images/home-manyone-poster.jpg" autoplay muted loop playsinline aria-label="Manyone"></video>
        </div>
        <p class="home-gallery__name">manyone TLV / SOCIAL MEDIA</p>
      </div>

      <a class="home-gallery__item" href="1984-2025.html" data-categories="graphic-design" data-preview="images/projects/1984-2025/00-cover.jpg, images/projects/1984-2025/01.jpg, images/projects/1984-2025/02.jpg, images/projects/1984-2025/03.jpg">
        <div class="home-gallery__media">
          <img class="home-gallery__slide is-active" src="images/home-row2-booklet.jpg" alt="1984 / 2025">
        </div>
        <p class="home-gallery__name">1984 / 2025 /GRAPHIC &amp; TYPOGRAPHIC DESIGN</p>
      </a>

      <a class="home-gallery__item" href="hevel.html" data-categories="visual-identity" data-preview="images/projects/hevel/00-cover.jpg, images/projects/hevel/01.jpg, images/projects/hevel/02.jpg, images/projects/hevel/03.jpg">
        <div class="home-gallery__media">
          <img class="home-gallery__slide is-active" src="images/home-row2-portrait.jpg" alt="Hevel">
        </div>
        <p class="home-gallery__name">Hevel /BRANDING</p>
      </a>

      <a class="home-gallery__item" href="lifta.html" data-categories="visual-identity" data-preview="images/projects/lifta/00-cover.jpg, images/projects/lifta/01.jpg, images/projects/lifta/02.jpg, images/projects/lifta/03.jpg">
        <div class="home-gallery__media">
          <img class="home-gallery__slide is-active" src="images/projects/lifta/00-cover.jpg" alt="lifta">
        </div>
        <p class="home-gallery__name">lifta <span class="text-arabic" lang="ar">لفتا</span> /VISUAL IDENTITY</p>
      </a>

      <a class="home-gallery__item" href="portrait.html" data-categories="photography" data-preview="images/projects/portrait/00-cover.jpg, images/projects/portrait/01.jpg, images/projects/portrait/02.jpg, images/projects/portrait/03.jpg">
        <div class="home-gallery__media">
          <img class="home-gallery__slide home-gallery__slide--face is-active" src="images/home-photo-face.jpg" alt="Portrait">
        </div>
        <p class="home-gallery__name">Portrait /PHOTOGRAPHY</p>
      </a>

      <a class="home-gallery__item" href="sabra.html" data-categories="visual-identity photography" data-preview="images/projects/sabra/00-cover.jpg, images/projects/sabra/01.jpg, images/projects/sabra/02.jpg, images/projects/sabra/03.jpg">
        <div class="home-gallery__media">
          <img class="home-gallery__slide is-active" src="images/home-photo-cactus.jpg" alt="Sabra">
        </div>
        <p class="home-gallery__name">Sabra /BRANDING</p>
      </a>

      <a class="home-gallery__item" href="sela.html" data-categories="digital" data-preview="images/projects/sela/00-cover.jpg, images/projects/sela/01.jpg, images/projects/sela/02.jpg, images/projects/sela/03.jpg">
        <div class="home-gallery__media">
          <video class="home-gallery__slide home-gallery__slide--stone is-active" src="images/home-row2-stone.mp4" poster="images/home-row2-stone-poster.jpg" autoplay muted loop playsinline aria-label="Sela"></video>
        </div>
        <p class="home-gallery__name">Sela /UX/UI DESIGN</p>
      </a>

      <a class="home-gallery__item" href="posters.html" data-categories="graphic-design" data-preview="images/projects/posters/00-cover.jpg, images/projects/posters/01.jpg, images/projects/posters/02.jpg, images/projects/posters/03.jpg">
        <div class="home-gallery__media">
          <img class="home-gallery__slide is-active" src="images/projects/posters/00-cover.jpg" alt="Posters">
        </div>
        <p class="home-gallery__name">Posters /GRAPHIC DESIGN / IMAGEMAKING</p>
      </a>

      <a class="home-gallery__item" href="modern-warfare.html" data-categories="graphic-design" data-preview="images/projects/modern-warfare/01.jpg, images/projects/modern-warfare/02.jpg, images/projects/modern-warfare/03.jpg, images/projects/modern-warfare/04.jpg">
        <div class="home-gallery__media">
          <img class="home-gallery__slide is-active" src="images/projects/modern-warfare/01.jpg" alt="Modern Warfare">
        </div>
        <p class="home-gallery__name">Modern Warfare /GRAPHIC &amp; TYPOGRAPHIC DESIGN</p>
      </a>
    </div>
  </main>

  <!-- החלון שנפתח בלחיצה על פרויקט: מלבן לבן לרוחב ובתוכו 4 דימויים (נבנים ב-project-window.js) -->
  <div class="pw" aria-hidden="true">
    <div class="pw__box"></div>
  </div>

  <!-- "scroll down" שמופיע ליד העכבר כשחלון הפרויקט פתוח -->
  <div class="scroll-cursor" aria-hidden="true">scroll down</div>

  <!-- הסמן עם החץ (ריבוע עם קו לבן): מחליף את העכבר כשהוא על פרויקט -->
  <div class="explore-cursor" aria-hidden="true">
    <img src="images/arrow-right.png" alt="">
  </div>

  <script>
    // ===== מסך הפתיחה =====
    const intro = document.querySelector(".intro");
    if (intro) {
      const introLetter = intro.querySelector(".intro__letter");
      const LETTERS = ["m", "a", "y", "m", "i", "n", "a"];
      const LETTER_SPEED = 100; // כל אות מופיעה 0.1 שנייה, כמו באתר של Bibliothèque
      const MIN_ROUNDS = 2;     // כמה פעמים לפחות עוברים על כל האותיות
      const FADE_DURATION = 500; // כמה זמן המסך נעלם בהדרגה

      let letterIndex = 0;
      let rounds = 0;
      let pageLoaded = false;
      window.addEventListener("load", () => { pageLoaded = true; });

      function nextLetter() {
        letterIndex = (letterIndex + 1) % LETTERS.length;
        if (letterIndex === 0) rounds++;
        introLetter.textContent = LETTERS[letterIndex];

        // עוצרים על האות האחרונה, אחרי מספיק סיבובים וכשהעמוד סיים להיטען
        const onLastLetter = letterIndex === LETTERS.length - 1;
        if (onLastLetter && rounds >= MIN_ROUNDS - 1 && pageLoaded) {
          setTimeout(hideIntro, LETTER_SPEED * 3);
        } else {
          setTimeout(nextLetter, LETTER_SPEED);
        }
      }

      function hideIntro() {
        intro.classList.add("is-hidden");
        setTimeout(() => intro.remove(), FADE_DURATION);
      }

      // מי שביקש במחשב פחות אנימציות: בלי אותיות מתחלפות
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        hideIntro();
      } else {
        // מתחילים אחרי שהפונט נטען, כדי שהאותיות לא יופיעו קודם בפונט אחר
        document.fonts.ready.then(() => setTimeout(nextLetter, LETTER_SPEED));
      }
    }

    // ===== סינון לפי קטגוריה =====
    // לחיצה על קטגוריה בתפריט מציגה רק את הפרויקטים שלה. "works" מציג הכול.
    // הקטגוריה נשמרת בכתובת (למשל index.html?category=photography), כך שאפשר לקשר אליה
    const filterButtons = document.querySelectorAll("[data-filter]");
    const galleryItems = document.querySelectorAll(".home-gallery__item");

    function showCategory(category) {
      filterButtons.forEach(b => b.classList.toggle("is-selected", b.dataset.filter === category));
      let column = 0;
      galleryItems.forEach(function (item) {
        const show = category === "all" || item.dataset.categories.split(" ").includes(category);
        item.hidden = !show;
        // באיזו עמודה הפרויקט (1, 2 או 3): קובע כמה השם שלו זז פנימה, כמו בפיגמה
        if (show) item.dataset.column = (column++ % 3) + 1;
      });
      history.replaceState(null, "", category === "all" ? "index.html" : "index.html?category=" + category);
    }

    filterButtons.forEach(function (button) {
      button.addEventListener("click", () => showCategory(button.dataset.filter));
    });

    showCategory(new URLSearchParams(location.search).get("category") || "all");

    // ===== הסמן עם החץ: מחליף את העכבר כשהוא על פרויקט =====
    const exploreCursor = document.querySelector(".explore-cursor");
    document.querySelectorAll(".home-gallery__item[data-preview]").forEach(function (item) {
      item.addEventListener("mouseenter", () => document.body.classList.add("is-over-project"));
      item.addEventListener("mouseleave", () => document.body.classList.remove("is-over-project"));
    });

    document.addEventListener("mousemove", function (event) {
      exploreCursor.style.transform = `translate(${event.clientX}px, ${event.clientY}px)`;
    });

    // ===== סרטונים בלולאה =====
    // לכל הסרטונים יש loop, וזו רשת ביטחון: אם סרטון בכל זאת נעצר בסוף, מתחילים אותו מחדש
    document.querySelectorAll("video[loop]").forEach(function (video) {
      video.addEventListener("ended", function () {
        video.currentTime = 0;
        video.play();
      });
    });
  </script>

  <!-- חלון הפרויקט שנפתח בלחיצה על פרויקט -->
  <script src="project-window.js"></script>
</body>
</html>
